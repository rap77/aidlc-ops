name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Package tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tarball
        run: |
          set -e
          TAG="${{ steps.tag.outputs.name }}"
          BASENAME="aidlc-ops-${TAG}"
          # Stage a clean copy with only the files that ship in the kit.
          rm -rf stage
          mkdir -p stage
          cp -r scripts stage/scripts
          cp README.md stage/README.md
          cp .gitignore stage/.gitignore
          # Build a tar.gz with scripts/ at the root so it unpacks into a
          # single aidlc-ops-<tag>/ directory.
          tar -C stage -czf "${BASENAME}.tar.gz" .
          ls -lh "${BASENAME}.tar.gz"
          sha256sum "${BASENAME}.tar.gz" > "${BASENAME}.tar.gz.sha256"

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidlc-ops-tarball
          path: '*.tar.gz*'
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.tar.gz.sha256
          fail_on_unmatched_files: true
